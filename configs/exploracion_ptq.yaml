# Exploración (no es la Fase 5): ¿la PTQ degrada a los alumnos base?
# Se evalúa en VALIDACIÓN para no ver el split test antes de la evaluación final (D6/D7).
# Exportación según D4: TensorRT 10, imgsz 640, batch 1, dynamic False, simplify True,
# INT8 con el exportador de Ultralytics tal cual y calibración con configs/calib.yaml (500 img de train).

modelos:
  base_s0: runs/students/student_base_s0/weights/best.pt
  base_s1: runs/students/student_base_s1/weights/best.pt
  base_s2: runs/students/student_base_s2/weights/best.pt

salida: runs/exploracion/ptq_check      # copias de best.pt y engines (no se tocan las corridas originales)

exportacion:
  imgsz: 640
  batch: 1
  dynamic: false
  simplify: true
  calib_data: configs/calib.yaml

precisiones: [fp32, fp16, int8]

evaluacion:
  data: configs/data.yaml
  split: val
  imgsz: 640
  batch: 1
  conf: 0.001
  iou: 0.7

tabla: results/tables/exploracion_ptq_val.csv
