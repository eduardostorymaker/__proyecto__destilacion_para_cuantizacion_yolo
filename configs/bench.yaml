# Fase 8: eficiencia (D8 del CLAUDE.md).

engines: results/tables/engines.csv   # se miden SOLO los engines registrados (hash SHA-256 verificado)
prefijo_rutas: runs/exports/          # India; Japón usa runs/japan/exports/
data: configs/data.yaml                # imágenes de entrada: split test (precargadas en memoria)
split: test

imgsz: 640
batch: 1
calentamiento: 50
medidas: 500
repeticiones: 3
# Umbral de confianza del postproceso (NMS) en la medición: el de despliegue típico. La evaluación (D6) usa
# 0.001 para calcular la mAP; aquí se mide la latencia de uso real.
conf: 0.25
iou: 0.7

# Sistema sin otra carga: antes de CADA modelo se aborta si hay procesos de cómputo en la GPU o la carga es alta.
# Carga de GPU efectiva = uso × reloj SM / reloj SM máximo, promediada en muestras_carga lecturas (en reposo, P8,
# el escritorio de Windows marca ~10 % de uso relativo a un reloj de ~210 MHz, < 1 % del cómputo real).
# La CPU se mide dentro de WSL (psutil) y en Windows (powershell.exe), porque psutil no ve la carga de Windows.
max_util_gpu_pct: 10              # sobre la carga efectiva
max_cpu_pct: 20
max_cpu_windows_pct: 20
muestras_carga: 10
periodo_carga_s: 0.5
muestreo_relojes_s: 0.1                # muestreo de relojes de la GPU durante cada repetición

# Reloj de la GPU (decisión 2026-10-22): con batch 1 el driver puede bajar el reloj SM (p. ej., de 2730 a 1080 MHz,
# latencia ×2). Se fija con nvidia-smi -lgc en scripts/benchmark.ps1 y cada repetición de GPU se valida: la mediana
# del reloj SM durante las medidas debe estar en reloj_fijo_sm_mhz ± tolerancia_reloj_mhz; si no, se repite.
reloj_fijo_sm_mhz: 2505
tolerancia_reloj_mhz: 50
max_reintentos: 3

salidas:
  crudo: results/tables/efficiency_reps.csv   # una fila por modelo y repetición
  resumen: results/tables/efficiency.csv      # una fila por modelo (media ± d.e. entre repeticiones)
