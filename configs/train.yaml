# Hiperparámetros de entrenamiento (diseño D2 del CLAUDE.md).
# `comun` se aplica al maestro y a los alumnos; el bloque `sobrescribe` de cada rol reemplaza
# solo lo indicado. Entre alumno base y alumno KD la ÚNICA diferencia es la pérdida CWD (kd.yaml).

comun:
  data: configs/data.yaml
  imgsz: 640
  batch: 8
  nbs: 64
  epochs: 300
  optimizer: SGD         # explícito (no 'auto')
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  cos_lr: false
  # Aumentación: valores por defecto de Ultralytics, escritos explícitamente
  mosaic: 1.0
  close_mosaic: 10
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  translate: 0.1
  scale: 0.5
  fliplr: 0.5
  mixup: 0.0
  amp: true              # precisión mixta; confirmada en Fase 1b (FP32 satura la VRAM, ~7x más lento)
  deterministic: true
  workers: 8
  cache: disk            # 'ram' no es determinista en Ultralytics
  pretrained: true
  save_period: -1
  plots: true
  val: true              # validación por época en el split val (nunca test)

maestro:
  modelo: runs/pretrained/yolo11m.pt   # COCO; se descarga aquí si no existe
  seed: 0
  project: runs/teacher
  name: teacher_s0
  sobrescribe:
    patience: 50

alumno:
  modelo: runs/pretrained/yolo11n.pt
  semillas: [0, 1, 2]
  project: runs/students
  # name = student_{kd|base}_s{seed}
  sobrescribe:
    patience: 300        # = epochs: sin parada temprana

# Prueba de humo: verifica que el script corre
humo:
  epochs: 1
  fraction: 0.05
  project: runs/smoke
